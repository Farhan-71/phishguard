name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train a bootstrap model (needed by ml_service/scanner tests)
        run: python -m ml.training.train --n 1500
      - name: Backend + ML unit tests
        run: pytest -q

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: extension
        run: npm install
      - working-directory: extension
        run: npm test
